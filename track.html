<!--
  Nota: las columnas 'folio' y 'estatus' en Supabase son tipo TEXT.
  En JavaScript los recibimos como strings, por lo que no hay conflicto.
  El código asume que la columna 'estatus' contiene el estado actual del caso.
  Si en el futuro cambias el nombre del campo, actualiza la línea 40 del script.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Queja - Sun Berries</title>
    <meta name="description" content="Consulta el estado de tu queja o sugerencia mediante el número de folio asignado.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        // Tailwind config for custom colors
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        sun: { green: '#006400', gold: '#fccb06', red: '#D32F2F', light: '#f0fdf4' }
                    }
                }
            }
        };
        // Supabase client (same credentials as index.html)
        const supabaseUrl = 'https://kqetrbmwznmlizibquus.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZXRyYm13em5tbGl6aWJxdXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MzkxOTMsImV4cCI6MjA4NDQxNTE5M30.G06gOQmC5034XLEdGwfQeir6AgcnZa-GVWh2xxXtrhc';
        const clienteSupabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchFolioStatus(folio) {
            const { data, error } = await clienteSupabase
                .from('buzon_quejas')
                .select('*')
                .eq('folio', folio)
                .single();
            const statusDiv = document.getElementById('status');
            if (error || !data) {
                statusDiv.innerHTML = `<p class="text-red-600">No se encontró el folio <span class="font-bold">${folio}</span>. Verifica que el número sea correcto.</p>`;
                return;
            }
            // Assuming there is a column called 'estatus' – if not, display the whole record.
            const estatus = data.estatus || 'Pendiente';
            const detalle = data.mensaje || '';
            statusDiv.innerHTML = `
                <div class="p-6 bg-white rounded-xl shadow-md">
                    <h2 class="text-2xl font-bold text-sun-green mb-4">Estado del Folio ${folio}</h2>
                    <p class="mb-2"><span class="font-semibold">Estatus:</span> <span class="text-blue-600">${estatus}</span></p>
                    ${detalle ? `<p class="mb-2"><span class="font-semibold">Mensaje:</span> ${detalle}</p>` : ''}
                </div>`;
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const folioFromUrl = getQueryParam('folio');
            if (folioFromUrl) {
                document.getElementById('folioInput').value = folioFromUrl;
                fetchFolioStatus(folioFromUrl);
            }
        });
    </script>
    <style>
        body { background: linear-gradient(to bottom right, #e0f7fa, #fff9c4); }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-extrabold text-sun-green text-center mb-6">Seguimiento de Queja / Sugerencia</h1>
        <div class="mb-4">
            <label for="folioInput" class="block text-gray-700 font-medium mb-2">Introduce tu número de folio</label>
            <input type="text" id="folioInput" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:border-sun-green" placeholder="SB-2023-1234">
        </div>
        <button onclick="fetchFolioStatus(document.getElementById('folioInput').value.trim())" class="w-full bg-sun-green text-white font-bold py-2 rounded-lg hover:bg-green-800 transition">Buscar Estado</button>
        <div id="status" class="mt-6"></div>
    </div>
</body>
</html>
