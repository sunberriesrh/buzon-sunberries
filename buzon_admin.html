<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Buzón - Sun Berries</title>
    <meta name="description"
        content="Panel de administración del Buzón de Quejas y Sugerencias de Agrícola Sun Berries.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        sun: { green: '#006400', gold: '#fccb06', red: '#D32F2F', blue: '#1976D2' }
                    }
                }
            }
        }
    </script>
    <style>
        .card-enter {
            animation: cardIn 0.3s ease-out forwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .estado-badge {
            transition: all 0.2s ease;
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Dark mode overrides */
        .dark {
            color-scheme: dark;
        }

        .dark body {
            background-color: #0f172a;
        }

        .dark .bg-white {
            background-color: #1e293b;
        }

        .dark .bg-gray-100 {
            background-color: #0f172a;
        }

        .dark .bg-gray-200 {
            background-color: #1e293b;
        }

        .dark .bg-gray-50 {
            background-color: #334155;
        }

        .dark .text-gray-800 {
            color: #e2e8f0;
        }

        .dark .text-gray-700 {
            color: #cbd5e1;
        }

        .dark .text-gray-600 {
            color: #94a3b8;
        }

        .dark .text-gray-500 {
            color: #64748b;
        }

        .dark .text-gray-400 {
            color: #64748b;
        }

        .dark .border-gray-200 {
            border-color: #334155;
        }

        .dark .border-gray-100 {
            border-color: #334155;
        }

        .dark .border-gray-300 {
            border-color: #475569;
        }

        .dark .shadow-md {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .dark input,
        .dark select,
        .dark textarea {
            background-color: #1e293b;
            color: #e2e8f0;
            border-color: #475569;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }

        /* Print styles for export */
        @media print {

            nav,
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="login-screen"
        class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-50 via-white to-emerald-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900">
        <img src="logo.png" alt="Sun Berries" class="h-28 mb-6 drop-shadow-lg">
        <div class="bg-white dark:bg-slate-800 p-10 rounded-3xl shadow-2xl w-96 border-t-[6px] border-sun-gold">
            <h2 class="text-2xl font-extrabold text-center text-sun-green mb-6">Acceso Buzón</h2>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label
                        class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1 block">Correo</label>
                    <input type="email" id="email" placeholder="admin@sunberries.com"
                        class="w-full p-3 border rounded-lg outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                        required>
                </div>
                <div>
                    <label
                        class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1 block">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full p-3 border rounded-lg outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition dark:bg-slate-700 dark:border-slate-600 dark:text-white"
                        required>
                </div>
                <button type="submit"
                    class="w-full bg-sun-green text-white font-bold py-3 rounded-xl hover:bg-green-800 transition transform hover:-translate-y-0.5 shadow-lg">Entrar</button>
            </form>
            <p id="loginError" class="text-red-500 text-sm mt-4 hidden text-center font-medium"></p>
        </div>
    </div>

    <!-- ==================== DASHBOARD SCREEN ==================== -->
    <div id="dashboard-screen" class="hidden pb-20">

        <!-- NAV -->
        <nav class="bg-gradient-to-r from-sun-green to-emerald-700 text-white shadow-xl sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16 md:h-20">
                    <div class="flex items-center gap-3">
                        <img class="h-9 w-9 rounded-full bg-white p-0.5 shadow" src="logo.png" alt="Logo">
                        <div>
                            <h1 class="text-lg md:text-xl font-extrabold tracking-wide leading-none">Buzón Confidencial
                            </h1>
                            <span class="text-[10px] text-green-200 uppercase tracking-widest">Lectura y
                                Seguimiento</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openPasswordModal()"
                            class="p-2 rounded-lg bg-green-800/50 hover:bg-green-900 transition text-lg"
                            title="Cambiar contraseña">🔑</button>
                        <button id="darkToggle" onclick="toggleDarkMode()"
                            class="p-2 rounded-lg bg-green-800/50 hover:bg-green-900 transition text-lg"
                            title="Modo oscuro">🌙</button>
                        <button onclick="logout()"
                            class="text-sm bg-green-800/50 hover:bg-green-900 px-4 py-2 rounded-lg border border-green-600/50 transition font-medium">Salir</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

            <!-- ========== NEW TOP SECTION ========== -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-md border-l-[6px] border-sun-gold mb-6 no-print flex flex-col md:flex-row items-center gap-8">
                <!-- Chart on the left -->
                <div class="w-full md:w-1/4 max-w-[250px] flex justify-center">
                    <div class="relative h-44 w-full"><canvas id="chartTipo"></canvas></div>
                </div>
                
                <!-- Title and Filters on the right -->
                <div class="flex-1 flex flex-col justify-center w-full">
                    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 dark:text-gray-100 mb-6 tracking-tight border-b pb-3 border-gray-100 dark:border-slate-700">Quejas, Sugerencias y Felicitaciones</h2>
                    
                    <div class="flex flex-wrap items-end gap-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase block mb-1 tracking-wider">Fecha inicio</label>
                            <input type="date" id="startDate" class="border border-gray-300 p-2.5 rounded-xl text-sm font-medium dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase block mb-1 tracking-wider">Fecha Fin</label>
                            <input type="date" id="endDate" class="border border-gray-300 p-2.5 rounded-xl text-sm font-medium dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition">
                        </div>
                        <button onclick="loadData()" class="bg-sun-green text-white px-8 py-2.5 rounded-xl hover:bg-green-800 text-sm font-extrabold transition shadow-md flex items-center gap-2 transform hover:-translate-y-0.5">
                            Filtrar
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        </button>

                        <!-- Search & Export float right -->
                        <div class="ml-auto flex items-end gap-3 w-full md:w-auto mt-4 md:mt-0">
                            <div class="relative flex-1 md:flex-none">
                                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Buscar..." class="w-full border border-gray-300 p-2.5 rounded-xl text-sm pl-9 font-medium dark:bg-slate-700 dark:border-slate-600 focus:outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition">
                                <svg class="w-4 h-4 text-gray-400 absolute left-3 bottom-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <button onclick="exportCSV()" class="bg-gray-100 text-gray-800 dark:bg-slate-700 dark:text-gray-200 px-4 py-2.5 rounded-xl hover:bg-gray-200 dark:hover:bg-slate-600 text-sm font-bold transition shadow-sm border border-gray-200 dark:border-slate-600">📥 CSV</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== MAIN LAYOUT ========== -->
            <div class="flex flex-col lg:flex-row gap-6">
                
                <!-- LEFT COLUMN: Status Filters -->
                <div class="w-full lg:w-1/4 flex flex-col gap-5">
                    <button id="btnFilterNuevo" onclick="setEstadoFilter('Nuevo')" class="estado-btn relative p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-md border-l-[8px] border-blue-500 text-left transition-all duration-300 transform hover:scale-[1.02] focus:outline-none">
                        <span class="block text-2xl font-extrabold text-blue-700 dark:text-blue-400 tracking-tight">Nuevo</span>
                        <span class="absolute top-1/2 -translate-y-1/2 right-6 text-5xl font-black text-blue-100 dark:text-blue-900/50 transition-colors duration-300" id="countNuevo">0</span>
                    </button>

                    <button id="btnFilterProceso" onclick="setEstadoFilter('En proceso')" class="estado-btn relative p-6 bg-white dark:bg-slate-800 rounded-2xl shadow border-l-[8px] border-yellow-500 text-left transition-all duration-300 transform hover:scale-[1.02] focus:outline-none opacity-50 hover:opacity-80">
                        <span class="block text-2xl font-extrabold text-yellow-600 dark:text-yellow-400 tracking-tight">En Proceso</span>
                        <span class="absolute top-1/2 -translate-y-1/2 right-6 text-5xl font-black text-yellow-100 dark:text-yellow-900/50 transition-colors duration-300" id="countProceso">0</span>
                    </button>

                    <button id="btnFilterResuelto" onclick="setEstadoFilter('Resuelto')" class="estado-btn relative p-6 bg-white dark:bg-slate-800 rounded-2xl shadow border-l-[8px] border-green-500 text-left transition-all duration-300 transform hover:scale-[1.02] focus:outline-none opacity-50 hover:opacity-80">
                        <span class="block text-2xl font-extrabold text-green-600 dark:text-green-400 tracking-tight">Resuelto</span>
                        <span class="absolute top-1/2 -translate-y-1/2 right-6 text-5xl font-black text-green-100 dark:text-green-900/50 transition-colors duration-300" id="countResuelto">0</span>
                    </button>

                    <button id="btnFilterDescartado" onclick="setEstadoFilter('Descartado')" class="estado-btn relative p-6 bg-white dark:bg-slate-800 rounded-2xl shadow border-l-[8px] border-gray-500 text-left transition-all duration-300 transform hover:scale-[1.02] focus:outline-none opacity-50 hover:opacity-80">
                        <span class="block text-2xl font-extrabold text-gray-600 dark:text-gray-400 tracking-tight">Descartado</span>
                        <span class="absolute top-1/2 -translate-y-1/2 right-6 text-5xl font-black text-gray-200 dark:text-gray-700/50 transition-colors duration-300" id="countDescartado">0</span>
                    </button>
                </div>

                <!-- RIGHT COLUMN: Case List (Large Card) -->
                <div class="w-full lg:w-3/4 bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-gray-100 dark:border-slate-700 overflow-hidden flex flex-col h-[750px]">
                    <!-- Header -->
                    <div class="bg-gray-50 dark:bg-slate-700/50 p-6 border-b border-gray-200 dark:border-slate-600 flex justify-between items-center z-10 shadow-sm">
                        <h3 class="text-xl font-extrabold text-gray-800 dark:text-gray-100 flex items-center gap-3">
                            <span id="listTitleIcon" class="text-2xl drop-shadow-sm">🆕</span> 
                            <span id="listTitleText">Vista Resumida - Nuevo</span>
                        </h3>
                        <span class="text-sm font-bold bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 px-4 py-1.5 rounded-xl shadow-sm border border-gray-100 dark:border-slate-600" id="totalMensajes">0 casos</span>
                    </div>
                    
                    <!-- List Container (Scrollable) -->
                    <div class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/50 dark:bg-slate-800/50 custom-scrollbar" id="feedbackWall">
                        <!-- Cards go here -->
                    </div>

                    <!-- Footer / Pagination -->
                    <div class="bg-white dark:bg-slate-800 p-5 border-t border-gray-200 dark:border-slate-600 flex justify-center items-center gap-6 no-print shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                        <button onclick="changePage(-1)" class="btnPrevBot px-5 py-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition font-bold disabled:opacity-40" disabled>← Anterior</button>
                        <span id="pageInfoBot" class="text-gray-500 dark:text-gray-400 font-bold bg-gray-50 dark:bg-slate-900 px-5 py-2.5 rounded-xl border border-gray-100 dark:border-slate-700">1 / 1</span>
                        <button onclick="changePage(1)" class="btnNextBot px-5 py-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition font-bold disabled:opacity-40" disabled>Siguiente →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL CAMBIAR CONTRASEÑA ==================== -->
    <div id="passwordModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closePasswordModal()"></div>
        <div
            class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden border-t-4 border-sun-gold">
            <div class="p-6">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-xl font-extrabold text-gray-800 dark:text-gray-100">🔑 Cambiar Contraseña</h3>
                    <button onclick="closePasswordModal()"
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">&times;</button>
                </div>
                <form id="passwordForm" class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1 block">Nueva
                            contraseña</label>
                        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" minlength="6" required
                            class="w-full p-3 border rounded-lg outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase mb-1 block">Confirmar
                            contraseña</label>
                        <input type="password" id="confirmPassword" placeholder="Repite la contraseña" minlength="6"
                            required
                            class="w-full p-3 border rounded-lg outline-none focus:border-sun-gold focus:ring-2 focus:ring-sun-gold/20 transition dark:bg-slate-700 dark:border-slate-600 dark:text-white">
                    </div>
                    <p id="passwordError" class="text-red-500 text-sm hidden font-medium"></p>
                    <p id="passwordSuccess" class="text-green-600 text-sm hidden font-medium"></p>
                    <div class="flex gap-3 pt-2">
                        <button type="button" onclick="closePasswordModal()"
                            class="flex-1 py-3 rounded-xl border border-gray-300 dark:border-slate-600 text-gray-600 dark:text-gray-300 font-bold hover:bg-gray-100 dark:hover:bg-slate-700 transition">Cancelar</button>
                        <button type="submit" id="btnChangePass"
                            class="flex-1 py-3 rounded-xl bg-sun-green text-white font-bold hover:bg-green-800 transition shadow-lg">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL DETALLE CASO ==================== -->
    <div id="caseDetailsModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeCaseDetailsModal()"></div>
        <div class="relative bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-5xl mx-4 overflow-hidden flex flex-col max-h-[90vh] border-t-[8px]" id="modalBorderTop">
            
            <!-- Modal Header -->
            <div class="p-5 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-900/50">
                <h3 class="text-2xl font-black text-gray-800 dark:text-gray-100 flex items-center gap-3">
                    <span id="modalIcon" class="text-3xl drop-shadow-sm"></span>
                    <span id="modalTipo">Detalle del Caso</span> 
                    <span id="modalFolio" class="text-sm font-mono font-bold bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 px-3 py-1 rounded-lg shadow-sm text-gray-500 ml-2"></span>
                </h3>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-white dark:bg-slate-800 p-1.5 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700">
                        <span class="text-xs font-bold text-gray-400 pl-2 uppercase">Estado:</span>
                        <select id="modalEstadoSelect" onchange="changeEstadoFromModal(this.value)" class="font-bold py-1.5 px-3 rounded-lg border-0 outline-none cursor-pointer text-sm bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 transition">
                            <option value="Nuevo">🆕 Nuevo</option>
                            <option value="En proceso">🔄 En proceso</option>
                            <option value="Resuelto">✅ Resuelto</option>
                            <option value="Descartado">❌ Descartado</option>
                        </select>
                    </div>
                    <button onclick="closeCaseDetailsModal()" class="text-gray-400 hover:text-red-500 dark:hover:text-red-400 text-4xl leading-none transition-colors">&times;</button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
                <!-- Left Side: Case Info -->
                <div class="w-full md:w-5/12 p-6 overflow-y-auto border-r border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 custom-scrollbar">
                    <div class="space-y-6">
                        <div>
                            <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg> Mensaje Original</h4>
                            <div class="bg-gray-50 dark:bg-slate-700/30 p-5 rounded-2xl border border-gray-100 dark:border-slate-600 shadow-inner">
                                <p id="modalMensaje" class="text-gray-800 dark:text-gray-200 whitespace-pre-wrap text-[15px] leading-relaxed font-medium italic">"..."</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-gray-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-gray-100 dark:border-slate-600">
                                <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">📍 Rancho</h4>
                                <p id="modalRancho" class="font-bold text-gray-800 dark:text-gray-200 text-sm"></p>
                            </div>
                            <div class="bg-gray-50 dark:bg-slate-700/30 p-4 rounded-2xl border border-gray-100 dark:border-slate-600">
                                <h4 class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">📅 Fecha</h4>
                                <p id="modalFecha" class="font-bold text-gray-800 dark:text-gray-200 text-sm"></p>
                            </div>
                        </div>

                        <div>
                            <h4 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-2 flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> Datos de Contacto</h4>
                            <div id="modalContacto" class="bg-blue-50/50 dark:bg-blue-900/10 p-5 rounded-2xl border border-blue-100 dark:border-blue-800/30 space-y-3 text-sm">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Seguimientos -->
                <div class="w-full md:w-7/12 flex flex-col bg-gray-50 dark:bg-slate-900/40 relative">
                    <div class="p-5 border-b border-gray-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm z-10 shadow-sm flex justify-between items-center">
                        <h4 class="font-extrabold text-gray-700 dark:text-gray-300 text-lg flex items-center gap-2">
                            📋 Historial de Seguimientos
                        </h4>
                        <span id="seguimientosCount" class="bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300 font-bold text-xs px-2.5 py-1 rounded-full">0</span>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar" id="seguimientoList">
                        <!-- Seguimientos cargados dinámicamente -->
                    </div>

                    <div class="p-5 bg-white dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10">
                        <form id="seguimientoForm" class="flex flex-col gap-3">
                            <input type="hidden" id="seguimientoItemId">
                            <div class="flex gap-3">
                                <select id="seguimientoTipo" required class="p-3 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-white outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition font-medium w-1/3">
                                    <option value="Llamada">📞 Llamada</option>

        // ===================== DATA & RENDER =====================
        async function loadData() {

            const { data, error } = await adminClient

        // ===================== FILTERS =====================
        function setEstadoFilter(estado) {
            currentEstadoFilter = estado;
            
            // Update button styles
            const buttons = {
                'Nuevo': 'btnFilterNuevo',
                'En proceso': 'btnFilterProceso',
                'Resuelto': 'btnFilterResuelto',
                'Descartado': 'btnFilterDescartado'
            };
            
            for (let e in buttons) {
                const btn = document.getElementById(buttons[e]);
                if (e === estado) {
                    btn.classList.remove('opacity-50', 'hover:opacity-80');
                    btn.classList.add('opacity-100', 'ring-2', 'ring-offset-2');
                    if (e==='Nuevo') btn.classList.add('ring-blue-500', 'dark:ring-blue-400');
                    if (e==='En proceso') btn.classList.add('ring-yellow-500', 'dark:ring-yellow-400');
                    if (e==='Resuelto') btn.classList.add('ring-green-500', 'dark:ring-green-400');
                    if (e==='Descartado') btn.classList.add('ring-gray-500', 'dark:ring-gray-400');
                } else {
                    btn.classList.add('opacity-50', 'hover:opacity-80');
                    btn.classList.remove('opacity-100', 'ring-2', 'ring-offset-2', 'ring-blue-500', 'dark:ring-blue-400', 'ring-yellow-500', 'dark:ring-yellow-400', 'ring-green-500', 'dark:ring-green-400', 'ring-gray-500', 'dark:ring-gray-400');

            document.getElementById('listTitleText').innerText = `Vista Resumida - ${estado}`;

            applyFilters();
        }

        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = allData.filter(item => {
                const matchSearch = !searchText ||
                    (item.mensaje || '').toLowerCase().includes(searchText) ||
                    (item.rancho || '').toLowerCase().includes(searchText) ||
                    (item.tipo_situacion || '').toLowerCase().includes(searchText) ||
                    (item.nombre_completo || '').toLowerCase().includes(searchText) ||
                    (item.folio || '').toLowerCase().includes(searchText);

                const estado = item.estado || 'Nuevo';
                const matchEstado = estado === currentEstadoFilter;

                return matchSearch && matchEstado;
            });

            currentPage = 1;
            totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
            renderPage();
        }

        // ===================== PAGINATION =====================
        function renderPage() {
            const startIdx = (currentPage - 1) * PAGE_SIZE;
            const endIdx = startIdx + PAGE_SIZE;
            const pageData = filteredData.slice(startIdx, endIdx);

            renderWall(pageData);
            updatePagination();
            document.getElementById('totalMensajes').innerText = filteredData.length + (filteredData.length === 1 ? ' caso' : ' casos');
        }

        function changePage(dir) {
            currentPage += dir;
            currentPage = Math.max(1, Math.min(currentPage, totalPages));
            renderPage();
            document.getElementById('feedbackWall').scrollTop = 0;
        }

        function updatePagination() {
            const info = `${currentPage} / ${totalPages}`;
            document.getElementById('pageInfoBot').innerText = info;

            document.querySelectorAll('.btnPrevBot').forEach(b => b.disabled = currentPage <= 1);
            document.querySelectorAll('.btnNextBot').forEach(b => b.disabled = currentPage >= totalPages);
        }

        // ===================== KPIs =====================
        function updateKPIs(data) {
            let counts = {'Nuevo': 0, 'En proceso': 0, 'Resuelto': 0, 'Descartado': 0};
            data.forEach(d => {
                const est = d.estado || 'Nuevo';
                if (counts[est] !== undefined) counts[est]++;
            });
            
            document.getElementById('countNuevo').innerText = counts['Nuevo'];
            document.getElementById('countProceso').innerText = counts['En proceso'];
            document.getElementById('countResuelto').innerText = counts['Resuelto'];
            document.getElementById('countDescartado').innerText = counts['Descartado'];
        }

        // ===================== RENDER CARDS =====================
        function renderWall(data) {

                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ===================== EXPORT CSV =====================
        function exportCSV() {
            if (filteredData.length === 0) {
                alert('No hay datos para exportar.');
                return;
            }

            const headers = ['Folio', 'Fecha', 'Rancho', 'Tipo', 'Mensaje', 'Nombre', 'Teléfono', 'Puesto', 'Correo', 'Estado'];
            const rows = filteredData.map(item => [
                item.folio || 'N/A',
                new Date(item.created_at).toLocaleDateString('es-MX'),
                item.rancho || '',
                item.tipo_situacion || '',
                `"${(item.mensaje || '').replace(/"/g, '""')}"`,
                item.nombre_completo || '',
                item.telefono || '',
                item.puesto || '',
                item.correo || '',
                item.estado || 'Nuevo'
            ]);

            const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `buzon_sunberries_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // ===================== CHARTS =====================
        function renderCharts(data) {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#6b7280';

            const count = (field) => data.reduce((acc, curr) => {
                const val = curr[field] || 'N/A';
                acc[val] = (acc[val] || 0) + 1;
                return acc;
            }, {});

            createChart('chartTipo', 'doughnut', count('tipo_situacion'), ['#ef4444', '#eab308', '#22c55e'], {
                plugins: { 
                    legend: { display: true, position: 'right', labels: { boxWidth: 12, color: textColor, font: { size: 11, weight: 'bold', family: 'Inter' } } } 
                },
                cutout: '65%',
                layout: { padding: 0 }
            });
        }

        function createChart(id, type, dataObj, colors, opts = {}) {
            const ctx = document.getElementById(id).getContext('2d');
            if (charts[id]) charts[id].destroy();

            const labels = Object.keys(dataObj);
            const values = Object.values(dataObj);
            const bg = Array.isArray(colors) ? colors : Array(labels.length).fill(colors);

            charts[id] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{ data: values, backgroundColor: bg, borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    ...opts
                }
            });
        }

        // ===================== CHANGE PASSWORD =====================
        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('passwordError').classList.add('hidden');
            document.getElementById('passwordSuccess').classList.add('hidden');
            document.getElementById('btnChangePass').disabled = false;
            document.getElementById('btnChangePass').innerText = 'Guardar';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('passwordError');
            const successEl = document.getElementById('passwordSuccess');
            const btn = document.getElementById('btnChangePass');

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (newPass.length < 6) {
                errorEl.innerText = '⚠ La contraseña debe tener al menos 6 caracteres.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (newPass !== confirmPass) {
                errorEl.innerText = '⚠ Las contraseñas no coinciden.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Guardando...';

            const { error } = await adminClient.auth.updateUser({ password: newPass });

            if (error) {
                errorEl.innerText = 'No se pudo cambiar la contraseña. Intenta de nuevo.';
                console.error('Error cambiando contraseña:', error);
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Guardar';
            } else {
                successEl.innerText = '✅ Contraseña actualizada correctamente.';
                successEl.classList.remove('hidden');
                btn.innerText = '¡Listo!';
                setTimeout(() => closePasswordModal(), 2000);
            }
        });

                    ${item.telefono ? `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/50 flex items-center justify-center text-green-600 dark:text-green-400">📱</div><span class="text-gray-700 dark:text-gray-300 font-medium">${item.telefono}</span></div>` : ''}
                    ${item.correo ? `<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-yellow-100 dark:bg-yellow-900/50 flex items-center justify-center text-yellow-600 dark:text-yellow-400">📧</div><span class="text-gray-700 dark:text-gray-300 font-medium">${item.correo}</span></div>` : ''}

        async function changeEstadoFromModal(selectEl) {
            if (!currentCaseId) return;
            const newEstado = selectEl.value;
            
            updateModalEstadoColor(newEstado);

            const { error } = await adminClient
                .from('buzon_quejas')
                .update({ estado: newEstado })
                .eq('id', currentCaseId);

            if (error) {
                console.error('Error al cambiar estado:', error);
                alert('No se pudo actualizar el estado. Intenta de nuevo.');
                return;
            }

            const item = allData.find(d => d.id == currentCaseId);

            applyFilters();
            updateKPIs(allData);

            selectEl.className = `text-sm font-bold py-1.5 px-3 rounded-xl border cursor-pointer outline-none transition-colors appearance-none pr-8 bg-no-repeat bg-[right_0.5rem_center] bg-[length:1em_1em]`;
            // Add custom SVG arrow
            selectEl.style.backgroundImage = `url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E")`;
            
            if (estado === 'Nuevo') selectEl.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-300', 'dark:bg-blue-900/50', 'dark:text-blue-300');
            else if (estado === 'En proceso') selectEl.classList.add('bg-yellow-100', 'text-yellow-700', 'border-yellow-300', 'dark:bg-yellow-900/50', 'dark:text-yellow-300');
            else if (estado === 'Resuelto') selectEl.classList.add('bg-green-100', 'text-green-700', 'border-green-300', 'dark:bg-green-900/50', 'dark:text-green-300');
            else if (estado === 'Descartado') selectEl.classList.add('bg-gray-200', 'text-gray-600', 'border-gray-300', 'dark:bg-gray-700', 'dark:text-gray-400');
        }

        async function loadSeguimientos(itemId) {
            const { data, error } = await adminClient
                .from('buzon_seguimientos')
                .select('*')
                .eq('buzon_id', itemId)
                .order('created_at', { ascending: false });

            const listContainer = document.getElementById('seguimientoList');
            const noSeguimientos = document.getElementById('noSeguimientos');

            if (error) {
                console.error('Error cargando seguimientos:', error);
                listContainer.innerHTML = '<p class="text-red-500 text-sm text-center">Error al cargar seguimientos.</p>';
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = '';
                noSeguimientos.classList.remove('hidden');
                return;
            }

            noSeguimientos.classList.add('hidden');
            listContainer.innerHTML = data.map(seg => {
                const date = new Date(seg.created_at).toLocaleDateString('es-MX', {
                    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const icono = ICONOS_SEGUIMIENTO[seg.tipo] || '📌';
                const usuarioHtml = seg.usuario_correo ? `<span class="text-[10px] text-purple-600 dark:text-purple-400 font-medium bg-purple-50 dark:bg-purple-900/30 px-2 py-0.5 rounded border border-purple-100 dark:border-purple-800">👤 ${seg.usuario_correo}</span>` : '';
                
                return `
                    <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-gray-100 dark:border-slate-600 shadow-sm relative">
                        <div class="absolute -left-3 top-6 w-6 h-6 bg-purple-100 dark:bg-purple-900/50 rounded-full border-4 border-gray-50 dark:border-slate-800 flex items-center justify-center text-xs">
                            ${icono}
                        </div>
                        <div class="ml-2">
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div class="flex flex-col gap-1.5">
                                    <span class="inline-flex items-center gap-1.5 text-xs font-bold text-gray-700 dark:text-gray-300">
                                        ${seg.tipo}
                                    </span>
                                    ${usuarioHtml}
                                </div>
                                <span class="text-[10px] font-bold text-gray-400 bg-gray-100 dark:bg-slate-700 px-2 py-1 rounded-md">${date}</span>
                            </div>
                            <p class="text-sm text-gray-600 dark:text-gray-300 whitespace-pre-wrap mt-1 leading-relaxed">${seg.descripcion}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('seguimientoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentCaseId) return;
            const tipo = document.getElementById('seguimientoTipo').value;
            const descripcion = document.getElementById('seguimientoDescripcion').value.trim();
            
            if (!descripcion) return;
            
            const btn = document.getElementById('btnAgregarSeguimiento');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin w-4 h-4 mr-2 inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Guardando...';
            
            const { data: sessionData } = await adminClient.auth.getSession();
            const usuarioCorreo = sessionData?.session?.user?.email || '';
            
            const { error } = await adminClient
                .from('buzon_seguimientos')
                .insert([{
                    buzon_id: currentCaseId,
                    tipo: tipo,
                    descripcion: descripcion,
                    usuario_correo: usuarioCorreo
                }]);
            
            if (error) {
                console.error('Error guardando seguimiento:', error);
                alert('No se pudo guardar el seguimiento. Intenta de nuevo.');
            } else {
                document.getElementById('seguimientoDescripcion').value = '';
                await loadSeguimientos(currentCaseId);
            }
            btn.disabled = false;
            btn.innerHTML = originalText;
        });

        // ===================== INIT =====================
        initDarkMode();
        checkSession();
    </script>
</body>

</html>
